[project]
name = "intro"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "dvc>=3.67.1",
    "fastapi>=0.139.2",
    "jupyterlab>=4.6.2",
    "matplotlib>=3.11.1",
    "numpy>=2.4.6",
    "pandas>=3.0.5",
    "polars>=1.43.0",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.9.0",
    "seaborn>=0.13.2",
    "statsmodels>=0.14.6",
    "torch>=2.13.0",
    "uvicorn>=0.51.0",
    "wandb>=0.28.1",
]

[project.scripts]
train = "train:main"

[dependency-groups]
dev = [
    "jupytext>=1.19.5",
    "pytest>=9.0.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# import the transformers from scripts/ directly rather than through the editable
# install, so the tests exercise the working copy even if the install is stale
pythonpath = ["scripts"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# scripts/ holds top-level modules (train, ml_utils, preprocessing), not a
# package dir, so map its contents to the wheel root instead of nesting them
# under a "scripts." prefix -- this keeps the flat imports working
only-include = ["scripts"]
sources = ["scripts"]
