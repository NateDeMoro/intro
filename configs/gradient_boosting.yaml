# working config for this model family -- edit in place; wandb keeps the history of every run
model: gradient_boosting
# optional features to switch on -- valid names are the keys of OPTIONAL_FEATURES in preprocessing.py
features: [male_x_3rdclass, under10, family_group]
# no `scale:` -- trees split on thresholds, so feature magnitude is irrelevant to them
params:
  # small, slow corrections suit 891 rows; large trees at a fast rate would memorize it.
  # the 30-combination sweep picked lr 0.1 / 200 iters / 16 leaves / min_leaf 40 / l2 1.0,
  # which scored worse on the same folds (0.829 +/- 0.020 vs 0.835 +/- 0.013)
  learning_rate: 0.05
  max_iter: 300
  max_leaf_nodes: 8
  min_samples_leaf: 20
  random_state: 42

# uncomment to sweep -- adding n_iter samples that many combinations instead of trying all
# n_iter: 30
# search:
#   learning_rate: [0.02, 0.05, 0.1, 0.2]
#   max_iter: [100, 200, 300, 500]
#   max_leaf_nodes: [4, 8, 16, 31]
#   min_samples_leaf: [5, 10, 20, 40]
#   l2_regularization: [0.0, 0.1, 1.0]
