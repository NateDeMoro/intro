# working config for this model family -- edit in place; wandb keeps the history of every run
model: logistic_regression
# optional features to switch on -- valid names are the keys of OPTIONAL_FEATURES in preprocessing.py
features: [male_x_3rdclass, under10, family_group]
# C penalizes coefficient size, so features must be on a comparable scale for it to mean anything
scale: true
params:
  max_iter: 1000

# uncomment to sweep instead of using a fixed value (C=1 won the last sweep, 0.815)
# search:
#   C: [0.001, 0.01, 0.1, 1, 10, 100]
