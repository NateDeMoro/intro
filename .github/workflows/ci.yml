name: CI

on:
  push:
    branches: [main]
  pull_request:

# a second push to the same branch cancels the run still going for the first one --
# nothing here depends on every commit being tested, only the tip
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # nothing in tests/ calls wandb today, but train.py opens a run on import-and-call.
      # offline mode means a test that reaches it writes to disk instead of blocking on a
      # login prompt the runner can never answer
      WANDB_MODE: offline
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v9
        with:
          # caches the resolved wheels against uv.lock, so only the first run on a
          # given lockfile pays for downloading torch and friends
          enable-cache: true
          cache-dependency-glob: uv.lock

      # --locked fails rather than silently re-resolving, so a pyproject.toml edit that
      # was never followed by a `uv sync` is caught here instead of drifting
      - name: Install dependencies
        run: uv sync --locked --group dev

      - name: Run tests
        run: uv run pytest
